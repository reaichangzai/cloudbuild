################################################################################
# IPQ6000 固件编译工作流 (调用编译核心)
#
# 功能说明：
# - 这是具体的设备编译工作流
# - 调用核心编译工作流，传入 IPQ6000 相关参数
# - 支持手动触发或仓库事件触发
#
################################################################################

name: Build IPQ6000 Firmware

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: 🏗️ 编译 IPQ6000 固件
    uses: ./.github/workflows/openwrt-build-core.yml
    with:
      # ========================================================================
      # 源代码配置
      # ========================================================================
      repo_url: https://github.com/reaichangzai/ipq6000.git
      repo_branch: master
      
      # ========================================================================
      # 编译配置
      # ========================================================================
      config_file: ./config/ipq6000.config
      feeds_conf: feeds.conf.default
      diy_p1_sh: ./scripts/diy-part1.sh
      diy_p2_sh: ./scripts/diy-part2.sh
      
      # ========================================================================
      # 产物配置
      # ========================================================================
      upload_release: true

################################################################################
# 后续处理 (可选)
################################################################################

  notification:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📢 编译完成通知
        run: |
          echo "固件编译完成!"
          echo "设备: ${{ needs.build.outputs.device_name }}"
          echo "路径: ${{ needs.build.outputs.firmware_path }}"
          echo "时间: ${{ needs.build.outputs.build_time }}"

################################################################################
# 工作流完成
################################################################################
